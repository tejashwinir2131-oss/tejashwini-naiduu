<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tejashwini R - Computer Science Engineering Student & Creative Developer. Premium futuristic portfolio showcasing AI solutions, healthcare tech, and software development.">
    <meta name="keywords" content="Tejashwini R, Computer Science Engineering, Software Engineer, Portfolio, AI, Web Development, Java, C++, React, Smart India Hackathon">
    <meta name="author" content="Tejashwini R">
    <title>Tejashwini R | Computer Science Engineering Portfolio</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        display: ['"Cabinet Grotesk"', 'sans-serif'],
                        mono: ['"Space Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            dark: '#030307',
                            darker: '#010103',
                            surface: 'rgba(12, 14, 24, 0.65)',
                            surfaceHover: 'rgba(18, 22, 38, 0.85)',
                            blue: '#00d2ff',
                            electricBlue: '#38bdf8',
                            purple: '#a855f7',
                            violet: '#7c3aed',
                            neonPink: '#ec4899',
                            lightBg: '#f8fafc',
                            lightSurface: 'rgba(255, 255, 255, 0.85)',
                        }
                    },
                    animation: {
                        'float-character': 'floatHoodie 7s ease-in-out infinite',
                        'float-badge-1': 'floatBadge1 5.5s ease-in-out infinite',
                        'float-badge-2': 'floatBadge2 6.5s ease-in-out 1.2s infinite',
                        'pulse-glow': 'pulseGlow 5s ease-in-out infinite',
                        'road-flow': 'pathwayMotion 1.2s linear infinite',
                    },
                    keyframes: {
                        floatHoodie: {
                            '0%, 100%': { transform: 'translateY(0px) scale(1)' },
                            '50%': { transform: 'translateY(-14px) scale(1.015)' },
                        },
                        floatBadge1: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-8px) rotate(-1.5deg)' },
                        },
                        floatBadge2: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(8px) rotate(1.5deg)' },
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
                            '50%': { opacity: '0.75', transform: 'scale(1.1)' },
                        },
                        pathwayMotion: {
                            '0%': { backgroundPosition: '0 0' },
                            '100%': { backgroundPosition: '0 60px' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Base styles */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030307;
            color: #f8fafc;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        html:not(.dark) body {
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* Giant Background Typography: TEJASHWINI */
        .bg-giant-typography {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Cabinet Grotesk', sans-serif;
            font-size: clamp(5rem, 16vw, 16rem);
            font-weight: 900;
            line-height: 0.82;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            color: transparent;
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.08);
            text-shadow: 0 0 70px rgba(0, 210, 255, 0.09), 0 0 100px rgba(168, 85, 247, 0.08);
            transition: -webkit-text-stroke 0.4s ease;
        }

        html:not(.dark) .bg-giant-typography {
            -webkit-text-stroke: 1.5px rgba(15, 23, 42, 0.12);
            text-shadow: 0 0 50px rgba(56, 189, 248, 0.06);
        }

        /* 3D Perspective Cybernetic Grid / Pathway */
        .pathway-perspective-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 48vh;
            overflow: hidden;
            pointer-events: none;
            z-index: 2;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 60%, transparent 100%);
        }

        .pathway-grid {
            position: absolute;
            bottom: -60px;
            left: 50%;
            width: 150vw;
            height: 120%;
            transform: translateX(-50%) rotateX(72deg);
            transform-origin: bottom center;
            background: 
                linear-gradient(90deg, transparent 0%, rgba(0, 210, 255, 0.05) 25%, rgba(168, 85, 247, 0.12) 50%, rgba(0, 210, 255, 0.05) 75%, transparent 100%),
                linear-gradient(to bottom, #030307 0%, #080b18 100%);
            border-left: 2px solid rgba(0, 210, 255, 0.35);
            border-right: 2px solid rgba(168, 85, 247, 0.35);
            box-shadow: 0 0 60px rgba(0, 210, 255, 0.15) inset;
        }

        html:not(.dark) .pathway-grid {
            background: 
                linear-gradient(90deg, transparent 0%, rgba(56, 189, 248, 0.06) 25%, rgba(168, 85, 247, 0.08) 50%, rgba(56, 189, 248, 0.06) 75%, transparent 100%),
                linear-gradient(to bottom, #f1f5f9 0%, #e2e8f0 100%);
            border-left: 2px solid rgba(56, 189, 248, 0.4);
            border-right: 2px solid rgba(168, 85, 247, 0.4);
        }

        .pathway-stripes {
            position: absolute;
            top: 0;
            left: 50%;
            width: 7px;
            height: 100%;
            transform: translateX(-50%);
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 210, 255, 0.95) 0px,
                rgba(0, 210, 255, 0.95) 25px,
                transparent 25px,
                transparent 60px
            );
            filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.9));
            animation: roadForward 0.9s linear infinite;
        }

        .pathway-lane-left {
            position: absolute;
            top: 0;
            left: 30%;
            width: 1.5px;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(168, 85, 247, 0.6) 0px,
                rgba(168, 85, 247, 0.6) 20px,
                transparent 20px,
                transparent 50px
            );
            animation: roadForward 0.9s linear infinite;
        }

        .pathway-lane-right {
            position: absolute;
            top: 0;
            right: 30%;
            width: 1.5px;
            height: 100%;
            background: repeating-linear-gradient(
                to bottom,
                rgba(168, 85, 247, 0.6) 0px,
                rgba(168, 85, 247, 0.6) 20px,
                transparent 20px,
                transparent 50px
            );
            animation: roadForward 0.9s linear infinite;
        }

        @keyframes roadForward {
            from { background-position: 0 0; }
            to { background-position: 0 60px; }
        }

        /* Glassmorphism Luxury Styling */
        .glass-panel-luxury {
            background: rgba(12, 14, 24, 0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
        }

        html:not(.dark) .glass-panel-luxury {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 20px 40px -15px rgba(168, 85, 247, 0.08);
        }

        .glass-card-hover {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card-hover:hover {
            transform: translateY(-4px);
            border-color: rgba(0, 210, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(0, 210, 255, 0.15);
        }

        /* Character Halo and Mask */
        .character-glow-halo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.25) 0%, rgba(168, 85, 247, 0.22) 45%, transparent 70%);
            filter: blur(50px);
            pointer-events: none;
            z-index: 3;
        }

        .hoodie-character-mask {
            mask-image: radial-gradient(circle at 50% 48%, black 65%, rgba(0,0,0,0.85) 80%, transparent 98%);
            -webkit-mask-image: radial-gradient(circle at 50% 48%, black 65%, rgba(0,0,0,0.85) 80%, transparent 98%);
        }

        /* Section Headings */
        .gradient-heading {
            background: linear-gradient(135deg, #ffffff 30%, #00d2ff 70%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        html:not(.dark) .gradient-heading {
            background: linear-gradient(135deg, #0f172a 30%, #0284c7 70%, #7e22ce 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React 18, Babel Standalone -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Main React Application -->
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- SVGs & Icons ---
        const SunIcon = () => (
            <svg className="w-4 h-4 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <circle cx="12" cy="12" r="5"></circle>
                <line x1="12" y1="1" x2="12" y2="3"></line>
                <line x1="12" y1="21" x2="12" y2="23"></line>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                <line x1="1" y1="12" x2="3" y2="12"></line>
                <line x1="21" y1="12" x2="23" y2="12"></line>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
        );

        const MoonIcon = () => (
            <svg className="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        );

        const ArrowUpRight = () => (
            <svg className="w-4 h-4 transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
        );

        const SparklesIcon = () => (
            <svg className="w-3.5 h-3.5 text-cyan-400 animate-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            </svg>
        );

        const CodeIcon = () => (
            <svg className="w-5 h-5 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
            </svg>
        );

        const CpuIcon = () => (
            <svg className="w-5 h-5 text-purple-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                <rect x="9" y="9" width="6" height="6"></rect>
                <line x1="9" y1="1" x2="9" y2="4"></line>
                <line x1="15" y1="1" x2="15" y2="4"></line>
                <line x1="9" y1="20" x2="9" y2="23"></line>
                <line x1="15" y1="20" x2="15" y2="23"></line>
                <line x1="20" y1="9" x2="23" y2="9"></line>
                <line x1="20" y1="14" x2="23" y2="14"></line>
                <line x1="1" y1="9" x2="4" y2="9"></line>
                <line x1="1" y1="14" x2="4" y2="14"></line>
            </svg>
        );

        const TrophyIcon = () => (
            <svg className="w-6 h-6 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.45 1-1 1H7v2h10v-2h-2c-.55 0-1-.45-1-1v-2.34"></path>
                <path d="M18 4H6v7a6 6 0 0 0 12 0V4Z"></path>
            </svg>
        );

        const GraduationIcon = () => (
            <svg className="w-6 h-6 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
            </svg>
        );

        // --- NAVIGATION COMPONENT ---
        const Navbar = ({ isDark, toggleTheme }) => {
            const [scrolled, setScrolled] = useState(false);
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 20);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <header className={`fixed top-0 left-0 w-full z-50 transition-all duration-500 ${
                    scrolled ? 'py-3.5 bg-[#030307]/80 dark:bg-[#030307]/85 backdrop-blur-xl border-b border-white/10 shadow-2xl' : 'py-6 bg-transparent'
                }`}>
                    <div className="max-w-7xl mx-auto px-6 md:px-12 flex items-center justify-between">
                        {/* Brand Monogram */}
                        <a href="#hero" className="flex items-center gap-3.5 group">
                            <div className="relative w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-400 via-blue-600 to-purple-600 p-[1px] shadow-lg shadow-cyan-500/25 group-hover:shadow-cyan-500/45 transition-all duration-300">
                                <div className="w-full h-full bg-[#060812] rounded-[11px] flex items-center justify-center">
                                    <span className="font-mono font-bold text-xs bg-gradient-to-r from-cyan-300 to-purple-300 bg-clip-text text-transparent group-hover:scale-110 transition-transform">TR</span>
                                </div>
                            </div>
                            <div className="flex flex-col">
                                <span className="font-display font-black text-sm tracking-wider text-slate-900 dark:text-white flex items-center gap-1.5">
                                    TEJASHWINI R
                                </span>
                                <span className="font-mono text-[10px] text-cyan-500 dark:text-cyan-400 tracking-widest uppercase">CS ENGINEER</span>
                            </div>
                        </a>

                        {/* Desktop Navigation Links */}
                        <nav className="hidden lg:flex items-center gap-8 px-7 py-2 rounded-full glass-panel-luxury">
                            {['About', 'Skills', 'Projects', 'Achievements', 'Education', 'Contact'].map((item) => (
                                <a 
                                    key={item} 
                                    href={`#${item.toLowerCase()}`}
                                    className="font-mono text-xs uppercase tracking-widest text-slate-600 dark:text-slate-300 hover:text-cyan-400 dark:hover:text-cyan-400 transition-colors relative py-1 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-0 after:h-[2px] after:bg-gradient-to-r after:from-cyan-400 after:to-purple-500 hover:after:w-full after:transition-all after:duration-300"
                                >
                                    {item}
                                </a>
                            ))}
                        </nav>

                        {/* Theme Switch & Minimal Action */}
                        <div className="flex items-center gap-3.5">
                            <button
                                onClick={toggleTheme}
                                className="p-2.5 rounded-full glass-panel-luxury hover:border-cyan-500/40 transition-all duration-300 hover:scale-105 active:scale-95 shadow-md flex items-center gap-2"
                                aria-label="Toggle light and dark mode"
                                title="Toggle Theme"
                            >
                                {isDark ? <MoonIcon /> : <SunIcon />}
                                <span className="font-mono text-[11px] uppercase tracking-wider text-slate-400 dark:text-slate-400 hidden sm:inline">
                                    {isDark ? 'NIGHT' : 'DAY'}
                                </span>
                            </button>

                            <a 
                                href="#contact"
                                className="hidden sm:inline-flex items-center gap-2 px-5 py-2 rounded-full text-xs font-mono font-semibold tracking-wider uppercase text-black bg-gradient-to-r from-cyan-400 via-sky-300 to-purple-300 hover:opacity-95 transition-all duration-300 shadow-lg shadow-cyan-500/25 hover:shadow-cyan-500/40 hover:-translate-y-0.5"
                            >
                                Let's Talk
                            </a>

                            {/* Mobile Hamburger Button */}
                            <button 
                                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                                className="lg:hidden p-2 rounded-xl glass-panel-luxury text-slate-300 hover:text-cyan-400"
                                aria-label="Toggle Menu"
                            >
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    {mobileMenuOpen ? (
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                    ) : (
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                                    )}
                                </svg>
                            </button>
                        </div>
                    </div>

                    {/* Mobile Dropdown */}
                    {mobileMenuOpen && (
                        <div className="lg:hidden mt-3 mx-6 p-4 rounded-2xl glass-panel-luxury flex flex-col gap-3">
                            {['About', 'Skills', 'Projects', 'Achievements', 'Education', 'Contact'].map((item) => (
                                <a 
                                    key={item} 
                                    href={`#${item.toLowerCase()}`}
                                    onClick={() => setMobileMenuOpen(false)}
                                    className="font-mono text-xs uppercase tracking-widest text-slate-300 hover:text-cyan-400 py-2 border-b border-white/5 last:border-0"
                                >
                                    {item}
                                </a>
                            ))}
                        </div>
                    )}
                </header>
            );
        };

        // --- COVERED-FACE HOODIE DEVELOPER CHARACTER CENTERPIECE ---
        const CoveredFaceHoodieCenterpiece = ({ mousePos }) => {
            const tiltX = (mousePos.y - 0.5) * -12;
            const tiltY = (mousePos.x - 0.5) * 16;

            return (
                <div 
                    className="relative w-full max-w-[440px] sm:max-w-[480px] lg:max-w-[530px] mx-auto flex items-center justify-center transition-transform duration-200 ease-out will-change-transform select-none"
                    style={{
                        transform: `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg) translateZ(15px)`,
                    }}
                >
                    {/* Glowing Halo & Ambient Neon Orbs */}
                    <div className="character-glow-halo animate-pulse-slow"></div>
                    <div className="absolute -inset-6 rounded-full bg-gradient-to-tr from-cyan-500/20 via-blue-600/15 to-purple-600/20 blur-3xl opacity-60 pointer-events-none"></div>

                    {/* Covered Face Female Developer Character in Oversized Hoodie */}
                    <div className="relative z-10 w-full animate-float-character">
                        <div className="relative overflow-hidden rounded-3xl hoodie-character-mask">
                            <img 
                                src="character-faceless.jpg" 
                                alt="Tejashwini R - Mysterious female software engineer in black hoodie at tech workstation" 
                                className="w-full h-auto object-cover object-center filter contrast-110 brightness-100 drop-shadow-[0_20px_50px_rgba(0,210,255,0.25)]"
                            />
                        </div>

                        {/* Floating Tech Badge Left: AI & Smart Systems */}
                        <div className="absolute top-1/4 -left-3 sm:-left-8 z-20 animate-float-badge-1">
                            <div className="glass-panel-luxury px-3.5 py-2 rounded-2xl border border-cyan-500/30 flex items-center gap-2.5 shadow-xl shadow-cyan-500/10">
                                <div className="w-7 h-7 rounded-lg bg-cyan-500/15 flex items-center justify-center border border-cyan-500/30">
                                    <SparklesIcon />
                                </div>
                                <div className="text-left">
                                    <div className="text-[10px] font-mono text-cyan-400 uppercase tracking-wider font-semibold">AI &amp; Smart Systems</div>
                                    <div className="text-[11px] font-sans font-bold text-slate-900 dark:text-white">Healthcare &bull; Assistive Tech</div>
                                </div>
                            </div>
                        </div>

                        {/* Floating Tech Badge Right: Problem Solver & Hackathons */}
                        <div className="absolute bottom-1/3 -right-3 sm:-right-8 z-20 animate-float-badge-2">
                            <div className="glass-panel-luxury px-3.5 py-2 rounded-2xl border border-purple-500/30 flex items-center gap-2.5 shadow-xl shadow-purple-500/10">
                                <div className="w-7 h-7 rounded-lg bg-purple-500/15 flex items-center justify-center border border-purple-500/30">
                                    <CodeIcon />
                                </div>
                                <div className="text-left">
                                    <div className="text-[10px] font-mono text-purple-400 uppercase tracking-wider font-semibold">Problem Solver</div>
                                    <div className="text-[11px] font-sans font-bold text-slate-900 dark:text-white">SIH Participant</div>
                                </div>
                            </div>
                        </div>

                        {/* Ground Underglow Reflection */}
                        <div className="absolute -bottom-6 left-1/2 -translate-x-1/2 w-[80%] h-12 bg-gradient-to-r from-cyan-500/30 via-blue-500/40 to-purple-500/30 blur-2xl rounded-full pointer-events-none"></div>
                    </div>
                </div>
            );
        };

        // --- 1. HERO COMPONENT ---
        const Hero = ({ isDark }) => {
            const [mousePos, setMousePos] = useState({ x: 0.5, y: 0.5 });
            const heroRef = useRef(null);

                            <div className="inline-flex items-center gap-2 px-3.5 py-1 rounded-full glass-panel-luxury text-[11px] font-mono text-cyan-400 border border-cyan-500/30 uppercase tracking-widest mb-3">
                                // 06. CONNECT
                            </div>
                            <h2 className="font-display font-extrabold text-3xl sm:text-4xl md:text-5xl gradient-heading tracking-tight mb-4">
                                Get In Touch
                            </h2>
                            <p className="text-slate-600 dark:text-slate-400 max-w-xl mx-auto text-sm sm:text-base">
                                Open to placement opportunities, internships, hackathon collaborations, and tech conversations.
                            </p>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            {/* Contact Details Column */}
                            <div className="lg:col-span-5 glass-panel-luxury p-8 sm:p-10 rounded-3xl border border-white/10 flex flex-col justify-between">
                                <div>
                                    <h3 className="font-display font-bold text-2xl text-slate-900 dark:text-white mb-4">
                                        Let's Build Something Impactful
                                    </h3>
                                    <p className="text-slate-600 dark:text-slate-300 text-sm leading-relaxed mb-8">
                                        Feel free to reach out directly via email or connect through professional channels.
                                    </p>

                                    <div className="space-y-4">
                                        <div className="flex items-center gap-4">
                                            <div className="w-10 h-10 rounded-xl bg-cyan-500/15 flex items-center justify-center text-cyan-400 border border-cyan-500/30">
                                                ✉️
                                            </div>
                                            <div>
                                                <div className="text-xs font-mono text-slate-400">EMAIL</div>
                                                <a href="mailto:tejashwini.cse@example.com" className="font-bold text-sm text-slate-900 dark:text-white hover:text-cyan-400 transition-colors">
                                                    tejashwini.cse@example.com
                                                </a>
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-4">
                                            <div className="w-10 h-10 rounded-xl bg-purple-500/15 flex items-center justify-center text-purple-400 border border-purple-500/30">
                                                💼
                                            </div>
                                            <div>
                                                <div className="text-xs font-mono text-slate-400">LINKEDIN</div>
                                                <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" className="font-bold text-sm text-slate-900 dark:text-white hover:text-purple-400 transition-colors">
                                                    linkedin.com/in/tejashwini-r
                                                </a>
                                            </div>
                                        </div>

                                        <div className="flex items-center gap-4">
                                            <div className="w-10 h-10 rounded-xl bg-pink-500/15 flex items-center justify-center text-pink-400 border border-pink-500/30">
                                                🐙
                                            </div>
                                            <div>
                                                <div className="text-xs font-mono text-slate-400">GITHUB</div>
                                                <a href="https://github.com" target="_blank" rel="noopener noreferrer" className="font-bold text-sm text-slate-900 dark:text-white hover:text-pink-400 transition-colors">
                                                    github.com/tejashwini-r
                                                </a>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="mt-8 pt-6 border-t border-white/10 text-xs font-mono text-cyan-400 flex items-center gap-2">
                                    <span className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
                                    <span>AVAILABLE FOR SOFTWARE ROLES &bull; 2026</span>
                                </div>
                            </div>

                            {/* Interactive Contact Form */}
                            <div className="lg:col-span-7 glass-panel-luxury p-8 sm:p-10 rounded-3xl border border-white/10">
                                {submitted ? (
                                    <div className="p-8 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-center">
                                        <div className="text-4xl mb-3">🚀</div>
                                        <h4 className="font-bold text-xl text-cyan-400 mb-2">Message Transmitted!</h4>
                                        <p className="text-sm text-slate-300">Thank you for reaching out, Tejashwini will respond shortly.</p>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSubmit} className="space-y-5">
                                        <div>
                                            <label className="block text-xs font-mono text-slate-400 uppercase tracking-wider mb-2">Your Name</label>
                                            <input 
                                                type="text" 
                                                required
                                                placeholder="e.g. Alex Sharma"
                                                value={formData.name}
                                                onChange={(e) => setFormData({...formData, name: e.target.value})}
                                                className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 focus:outline-none text-slate-900 dark:text-white text-sm transition-colors"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-mono text-slate-400 uppercase tracking-wider mb-2">Email Address</label>
                                            <input 
                                                type="email" 
                                                required
                                                placeholder="alex@company.com"
                                                value={formData.email}
                                                onChange={(e) => setFormData({...formData, email: e.target.value})}
                                                className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 focus:outline-none text-slate-900 dark:text-white text-sm transition-colors"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-mono text-slate-400 uppercase tracking-wider mb-2">Message</label>
                                            <textarea 
                                                rows="4" 
                                                required
                                                placeholder="Let's discuss opportunities, projects, or collaborations..."
                                                value={formData.message}
                                                onChange={(e) => setFormData({...formData, message: e.target.value})}
                                                className="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 focus:border-cyan-400 focus:outline-none text-slate-900 dark:text-white text-sm transition-colors"
                                            ></textarea>
                                        </div>

                                        <button 
                                            type="submit"
                                            className="w-full py-3.5 rounded-xl text-xs font-mono font-bold tracking-wider uppercase text-black bg-gradient-to-r from-cyan-400 via-sky-300 to-purple-300 hover:opacity-95 shadow-xl shadow-cyan-500/25 transition-all duration-300 hover:-translate-y-0.5"
                                        >
                                            Send Message →
                                        </button>
                                    </form>
                                )}
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // --- 7. FOOTER COMPONENT ---
        const Footer = () => {
            return (
                <footer className="py-12 px-6 border-t border-white/10 bg-[#020205] text-slate-400 text-xs font-mono">
                    <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6">
                        <div className="flex items-center gap-3">
                            <span className="font-bold text-cyan-400">&lt;TR /&gt;</span>
                            <span>&copy; {new Date().getFullYear()} Tejashwini R &bull; Computer Science Engineering</span>
                        </div>

                        <div className="flex items-center gap-6">
                            <a href="#hero" className="hover:text-cyan-400 transition-colors">TOP ↑</a>
                            <a href="https://github.com" target="_blank" rel="noopener noreferrer" className="hover:text-cyan-400 transition-colors">GITHUB</a>
                            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" className="hover:text-cyan-400 transition-colors">LINKEDIN</a>
                        </div>
                    </div>
                </footer>
            );
        };

        // --- ROOT APP COMPONENT WITH PREFERS-COLOR-SCHEME & THEME STATE ---
        const App = () => {
            const [isDark, setIsDark] = useState(true);

            useEffect(() => {
                const prefersDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const savedTheme = localStorage.getItem('tejashwini-theme');

                if (savedTheme) {
                    setIsDark(savedTheme === 'dark');
                } else {
                    setIsDark(prefersDarkQuery.matches);
                }

                const handleChange = (e) => {
                    if (!localStorage.getItem('tejashwini-theme')) {
                        setIsDark(e.matches);
                    }
                };
                prefersDarkQuery.addEventListener('change', handleChange);
                return () => prefersDarkQuery.removeEventListener('change', handleChange);
            }, []);

            useEffect(() => {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            }, [isDark]);

            const toggleTheme = () => {
                const nextState = !isDark;
                setIsDark(nextState);
                localStorage.setItem('tejashwini-theme', nextState ? 'dark' : 'light');
            };

            return (
                <div className="min-h-screen bg-[#f8fafc] dark:bg-[#030307] text-slate-900 dark:text-slate-100 transition-colors duration-500">
                    <Navbar isDark={isDark} toggleTheme={toggleTheme} />
                    <Hero isDark={isDark} />
                    <About />
                    <Skills />
                    <Projects />
                    <AchievementsAndEducation />
                    <Contact />
                    <Footer />
                </div>
            );
        };

        // Render React Root
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
